[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sierraleone-ai-foundation"
version = "0.1.0"
description = "Sierra Leone Language AI Foundation – datasets, models and APIs for Sierra Leonean languages"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENCE"]
requires-python = ">=3.10"
authors = [
  { name = "CAFP Sierra Leone AI Team" }
]
keywords = ["krio", "sierra-leone", "nlp", "low-resource-language", "african-languages"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Natural Language :: English",
]
dependencies = [
  # Core schema / config
  "pydantic>=2.5",
  "pydantic-settings>=2.1",

  # Text utilities (actually used in preprocessing)
  "ftfy>=6.1",              # Apache-2.0 (not MIT – see DEPENDENCIES_AND_LICENCES.md)

  # API
  "fastapi>=0.109",         # MIT
  "uvicorn>=0.25",          # BSD-3-Clause
  "python-multipart>=0.0.9", # MIT – required for /transcribe UploadFile

  # Utilities
  "rich>=13.7",             # MIT
  "loguru>=0.7",            # MIT
  "typer>=0.9",             # MIT
  "python-dotenv>=1.0",     # BSD-3-Clause
]

[project.urls]
Homepage = "https://github.com/Innosldigital/SierraLeone-AI-Foundation"
Issues = "https://github.com/Innosldigital/SierraLeone-AI-Foundation/issues"
Documentation = "https://github.com/Innosldigital/SierraLeone-AI-Foundation/tree/main/documentation"

[project.optional-dependencies]
data = [
  "datasets>=2.16",         # Apache-2.0
  "pandas>=2.1",            # BSD-3-Clause
  "pyarrow>=14.0",          # Apache-2.0
]
eval = [
  "sacrebleu>=2.3",         # Apache-2.0 — preferred over hand-rolled BLEU for reporting
]
training = [
  # Opt-in extra — install ONLY on approved GPU hardware with SLAI_ALLOW_TRAINING=true
  "torch>=2.1",             # BSD-3-Clause
  "transformers>=4.37",     # Apache-2.0
  "peft>=0.8",              # Apache-2.0
  "bitsandbytes>=0.42",     # MIT
  "accelerate>=0.26",       # Apache-2.0
  "trl>=0.7",               # Apache-2.0
  "evaluate>=0.4",          # Apache-2.0
]
audio = [
  # Opt-in extra — install ONLY after verified audio collection is in place
  "torchaudio>=2.1",        # BSD-2-Clause
  "librosa>=0.10",          # ISC
  "soundfile>=0.12",        # BSD-3-Clause
  "openai-whisper>=20231117",  # MIT
]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "httpx>=0.26",            # BSD-3-Clause – TestClient backend (dev-only)
  "ruff>=0.1",
  "mypy>=1.8",
]

[project.scripts]
slai = "sierraleone_ai.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]  # line length handled by formatter, B008 allows FastAPI Depends/File in route signatures

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
  "ignore::DeprecationWarning:starlette.*",
  "ignore::DeprecationWarning:pydantic.*",
  "ignore:.*Using .httpx. with .starlette.testclient.*",
]
