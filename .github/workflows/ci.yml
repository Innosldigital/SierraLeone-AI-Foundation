name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    name: "Python ${{ matrix.python-version }} on ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,eval]"

      - name: Lint with ruff
        run: ruff check src tests scripts

      - name: Type-check with mypy
        run: mypy src tests scripts

      - name: Run tests with coverage
        run: pytest -v --cov=sierraleone_ai --cov-report=term-missing

      - name: Check no Krio text in tests (PA-015)
        shell: bash
        run: |
          if grep -rwnF -f .github/krio_strings_denylist.txt tests/; then
            echo "ERROR: Potential unreviewed Krio text found in test files."
            echo "Replace with neutral fixture strings like TEST_FIXTURE_TEXT_001."
            exit 1
          fi
          echo "OK: No unreviewed Krio text detected in test files."

      - name: Check datasets and benchmarks track only allowed files (PA-006)
        shell: bash
        run: |
          disallowed=$(git ls-files datasets benchmarks | grep -v -E '(\.gitkeep$|example_.*\.jsonl$|source_register\.csv$|.*schema.*\.jsonl$|manifests/.*\.manifest\.json$)') || true
          if [ -n "$disallowed" ]; then
            echo "ERROR: Real data or non-template file tracked in git under datasets/ or benchmarks/:"
            echo "$disallowed"
            exit 1
          fi
          echo "OK: datasets and benchmarks track only allowed templates, keepfiles, register, and manifests."

      - name: Reject committed secrets, .env, virtualenvs, caches, or model weights (SLAI-018 / SLAI-021)
        shell: bash
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "ERROR: .env is tracked in git!"
            exit 1
          fi
          if git ls-files | grep -E '(^|/)(\.venv|venv|__pycache__|\.pytest_cache|.*\.egg-info|.*\.(safetensors|bin|pt|pth|gguf))($|/)'; then
            echo "ERROR: Prohibited virtualenv, cache, egg-info, or model weight tracked in git!"
            exit 1
          fi
          if grep -rnE "hf_[A-Za-z0-9]{20,}" src/ tests/ documentation/ research/ .github/; then
            echo "ERROR: Hugging Face token pattern detected!"
            exit 1
          fi
          echo "OK: Repository hygiene and secret checks passed."
