name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: "Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,eval]"

      - name: Lint with ruff
        run: ruff check src tests

      - name: Type-check with mypy
        run: mypy src

      - name: Run tests with coverage
        run: pytest -v --cov=sierraleone_ai --cov-report=term-missing

      - name: Check no Krio text in tests
        # Fail if any test file contains a suspected unreviewed Krio sentence.
        # Krio text should ONLY appear in docs with <!-- UNVERIFIED --> markers.
        # This grep looks for Krio-specific patterns in test files.
        run: |
          if grep -rn "Kusheh\|duya\|bo,\|padi\|maket\|Aw di" tests/; then
            echo "ERROR: Potential unreviewed Krio text found in test files."
            echo "Replace with neutral fixture strings like TEST_FIXTURE_TEXT_001."
            exit 1
          fi
          echo "OK: No unreviewed Krio text detected in test files."

